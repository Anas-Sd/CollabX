name: Supabase Keep Alive

on:
  schedule:
    # Runs at 00:00 UTC every 3 days to prevent Supabase 7-day inactivity pause
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Enables manual trigger from GitHub Actions tab

jobs:
  ping-supabase:
    name: Ping Supabase Database & API
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "Sending keep-alive ping request to Supabase REST API..."
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X GET "${SUPABASE_URL}/rest/v1/" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
            echo "Supabase HTTP status response: $RESPONSE"
          else
            echo "SUPABASE_URL or SUPABASE_ANON_KEY secret is not set in Repository Secrets."
            echo "Please add SUPABASE_URL and SUPABASE_ANON_KEY in Settings -> Secrets and variables -> Actions."
          fi

      - name: Ping Backend Server
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -n "$BACKEND_URL" ]; then
            echo "Pinging backend server at $BACKEND_URL..."
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL")
            echo "Backend HTTP status response: $RESPONSE"
          fi
